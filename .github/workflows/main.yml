name: Build WRS Gempa Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Prepare TWA project
        run: |
          rm -rf android
          mkdir -p android

          bubblewrap init \
            --manifest=https://wrsgempa.netlify.app/manifest.json \
            --directory=android \
            --skipPwaValidation \
            --acceptTerms

      - name: Build Android APK
        working-directory: android
        run: |
          bubblewrap build \
            --skipPwaValidation

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find android -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: WRS-Gempa-Android-Test
          path: |
            android/**/*.apk
            android/**/*.aab
          if-no-files-found: error
