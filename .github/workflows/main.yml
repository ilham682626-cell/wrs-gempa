name: Build WRS Gempa Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap environment
        run: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"

      - name: Prepare TWA project
        run: |
          rm -rf android
          mkdir -p android

          cp twa-manifest.json android/twa-manifest.json

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const {
            TwaManifest,
            TwaGenerator
          } = require("@bubblewrap/core");

          (async () => {
            const dir = path.resolve("android");
            const manifestPath = path.join(dir, "twa-manifest.json");

            const manifest = await TwaManifest.fromFile(manifestPath);

            manifest.generatorApp = "WRS Gempa";

            const generator = new TwaGenerator();

            await generator.createTwaProject(
              dir,
              manifest,
              console,
              () => {}
            );

            await manifest.saveToFile(manifestPath);

            fs.writeFileSync(
              path.join(dir, "manifest-checksum.txt"),
              "generated-by-github-actions"
            );

            console.log("TWA project generated successfully.");
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build unsigned APK
        working-directory: android
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --skipSigning

      - name: Find APK
        run: |
          echo "=== ANDROID OUTPUT ==="
          find android -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WRS-Gempa-Android-Test
          path: |
            android/**/*.apk
            android/**/*.aab
          if-no-files-found: error
